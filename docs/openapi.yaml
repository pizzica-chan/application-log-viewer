openapi: 3.0.3
info:
  title: Application Log Viewer API
  description: |
    Java アプリケーションログを Web UI で閲覧・検索する障害調査用ツールの REST API。

    指定ディレクトリ配下のログファイルを再帰的に探索し、SQLite インデックスを構築したうえで
    フィルタ付き一覧・詳細（スタックトレース含む生ログ）を提供する。

    **注意:** ローカル検証専用。認証は実装されていないため、インターネットに公開しないこと。
  version: 1.0.0
  contact:
    name: Application Log Viewer
  license:
    name: MIT

servers:
  - url: http://127.0.0.1:8766
    description: ローカル開発（デフォルト）
  - url: http://localhost:8766
    description: Docker / ローカル

tags:
  - name: meta
    description: 読み込み状態・メタ情報
  - name: browse
    description: ディレクトリブラウザ
  - name: load
    description: ログ読み込み・インデックス構築
  - name: logs
    description: ログ検索・詳細
  - name: session
    description: セッション追跡（同一リクエストのログの抽出）

paths:
  /api/meta:
    get:
      tags: [meta]
      summary: 読み込み状態を取得
      description: |
        現在のログディレクトリ、読み込み対象ファイル、インデックス構築の進捗、
        エントリ件数、タイムスタンプ範囲、パース失敗行のサンプルなどを返す。
      operationId: getMeta
      responses:
        '200':
          description: メタ情報
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaResponse'
              examples:
                ready:
                  summary: 読み込み完了
                  value:
                    directory: D:/logs/app
                    files:
                      - D:/logs/app/application.log
                      - D:/logs/app/application.log.2026-06-28
                    loading: false
                    load_status: ready
                    load_progress: 12345
                    total: 12345
                    first: '2026-06-28T00:00:00.123'
                    last: '2026-06-29T23:59:59.999'
                loading:
                  summary: 読み込み中
                  value:
                    directory: D:/logs/app
                    files:
                      - D:/logs/app/application.log
                    loading: true
                    load_status: loading
                    load_progress: 5000
                    total: 5000
                    first: null
                    last: null

  /api/browse:
    get:
      tags: [browse]
      summary: ディレクトリ一覧を取得
      description: |
        ログディレクトリ選択 UI 向けに、指定パス直下のサブディレクトリ一覧を返す。
        `path` を省略した場合は、現在のログルート（未設定時はカレントディレクトリ）を起点とする。
        ドット（`.`）で始まるディレクトリは除外される。
      operationId: browseDirectories
      parameters:
        - name: path
          in: query
          description: 探索開始パス（絶対パスまたは相対パス）
          required: false
          schema:
            type: string
          example: D:/logs
      responses:
        '200':
          description: ディレクトリ一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowseResponse'
        '400':
          description: ディレクトリ不存在または読み取りエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/load:
    post:
      tags: [load]
      summary: ログディレクトリを読み込み開始
      description: |
        指定ディレクトリ配下のログファイルを再帰的に探索し、SQLite インデックス構築を非同期で開始する。
        レスポンスは `/api/meta` と同じ形式で、開始直後の状態を返す。
        既に読み込み中の場合は新しい世代として再開始し、古いワーカーの結果は破棄される。
      operationId: loadDirectory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoadRequest'
            example:
              directory: D:/logs/app
      responses:
        '200':
          description: 読み込み開始後のメタ情報
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaResponse'
        '400':
          description: リクエスト不正（JSON 解析失敗、directory 未指定、ディレクトリ不存在、ログ探索失敗）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/logs:
    get:
      tags: [logs]
      summary: フィルタ付きログ一覧を取得
      description: |
        インデックス済みログをフィルタ条件で絞り込み、ページング付きで返す。

        - レベル・日時は SQL で事前絞り込み
        - logger / thread / message / source / grep は Java 側で正規表現マッチ（大文字小文字無視）
        - `grep` 指定時はスタックトレースを含む生ログ全文を照合

        インデックス構築中（`load_status == loading`）は `loading: true` と空の `items` を返す。
      operationId: queryLogs
      parameters:
        - name: level
          in: query
          description: ログレベル（カンマ区切り、大文字小文字無視）。例 `ERROR`, `WARN,ERROR`
          required: false
          schema:
            type: string
          example: WARN,ERROR
        - name: logger
          in: query
          description: ロガー名の正規表現（大文字小文字無視）
          required: false
          schema:
            type: string
        - name: thread
          in: query
          description: スレッド名の正規表現（大文字小文字無視）
          required: false
          schema:
            type: string
        - name: message
          in: query
          description: 1 行目メッセージの正規表現（大文字小文字無視）
          required: false
          schema:
            type: string
        - name: grep
          in: query
          description: エントリ全体（スタックトレース含む）の正規表現（大文字小文字無視）
          required: false
          schema:
            type: string
        - name: source
          in: query
          description: ログファイル名の正規表現（大文字小文字無視）
          required: false
          schema:
            type: string
        - name: since
          in: query
          description: |
            開始日時（この時刻以降）。
            対応形式: `yyyy-MM-ddTHH:mm:ss.SSS` / `yyyy-MM-dd HH:mm:ss.SSS` / `HH:mm:ss` 付き /
            `HH:mm` 付き / `yyyy-MM-dd`。
            存在しない日時（`2025-02-30` 等）や末尾に余分な文字がある入力は 400 を返す
            （繰り上げて別の期間として扱わない）。
          required: false
          schema:
            type: string
          example: '2026-06-28T00:00:00.000'
        - name: until
          in: query
          description: 終了日時（この時刻以前）。形式は `since` と同じ
          required: false
          schema:
            type: string
          example: '2026-06-29T23:59:59.999'
        - name: limit
          in: query
          description: 取得件数（デフォルト 500、最大 5000）
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 5000
            default: 500
        - name: offset
          in: query
          description: スキップ件数（デフォルト 0）
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
      responses:
        '200':
          description: ログ一覧（読み込み中の場合も 200）
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LogsResponse'
                  - $ref: '#/components/schemas/LogsLoadingResponse'
        '400':
          description: 正規表現不正、日時形式不正、limit/offset 非整数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 読み込み失敗（`load_status == error`）または内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/logs/detail:
    get:
      tags: [logs]
      summary: ログ詳細（生ログ全文）を取得
      description: |
        指定ログファイル・行番号のエントリについて、スタックトレースを含む生ログ全文を返す。
        同一行番号に複数エントリがある場合は `timestamp` で区別する。

        インデックス構築中は `loading: true` のみを返す。
      operationId: getLogDetail
      parameters:
        - name: source
          in: query
          description: ログファイルパス
          required: true
          schema:
            type: string
          example: D:/logs/app/application.log
        - name: line_no
          in: query
          description: 行番号（1 始まり）
          required: true
          schema:
            type: integer
            format: int64
          example: 42
        - name: timestamp
          in: query
          description: ISO タイムスタンプ（同一行番号の複数エントリを区別する場合に指定）
          required: false
          schema:
            type: string
          example: '2026-06-29T10:15:30.123'
      responses:
        '200':
          description: ログ詳細（読み込み中の場合も 200）
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LogDetailResponse'
                  - $ref: '#/components/schemas/DetailLoadingResponse'
        '400':
          description: source 未指定、line_no 非整数、timestamp 不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 該当行が見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 読み込み失敗または I/O エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/session-trace:
    get:
      tags: [session]
      summary: セッション ID を含むリクエストのログを、リクエストごとにまとめて取得
      description: |
        `id` を含むエントリ（スタックトレースを含む全体を文字列として照合、大文字小文字を区別）を起点に、
        **同じログファイル・同じスレッド**で `start` に一致する行から `end` に一致する行までを
        1 リクエストとして返す。`start` / `end` は 1 行目メッセージへの正規表現（大文字小文字無視）。

        - 起点から遡って最も近いはじまりを探す。途中で別のおわりに当たったら遡るのをやめる
        - 起点から進み、おわりで閉じる。おわりより先に次のはじまりが来たらその直前で閉じる
        - はじまりが無くても、次のはじまりより先におわりがあれば 1 リクエストとする（`start_found: false`）
        - はじまりもおわりも起点を囲まない行は単独で返す（`end_reason: standalone`）
        - どちらの方向も `max_minutes` を超えたところで打ち切る

        同期処理（1 リクエストを 1 スレッドが最後まで処理する）が前提。非同期処理で別スレッドに出たログ、
        WebFlux / Netty のように 1 スレッドで複数リクエストを交互に処理する方式、別ファイルに出たログは
        正しく扱えない。

        返すのは最大 200 リクエスト、1 リクエストあたり最大 1000 行。絞り込みで落としたものも
        数えるため、範囲を求めるリクエスト数は 2000 件で打ち切る（`truncated: true`）。
        インデックス構築中は `loading: true` のみを返す。
      operationId: traceSession
      parameters:
        - name: id
          in: query
          description: セッション ID などの識別子。正規表現ではなく文字列として照合する（大文字小文字を区別）
          required: true
          schema:
            type: string
          example: 8F3A2C91D4E6B7A0.node1
        - name: start
          in: query
          description: リクエストのはじまりの 1 行目メッセージに一致する正規表現（大文字小文字無視）
          required: true
          schema:
            type: string
          example: ^リクエスト開始
        - name: end
          in: query
          description: リクエストのおわりの 1 行目メッセージに一致する正規表現（大文字小文字無視）
          required: true
          schema:
            type: string
          example: ^リクエスト終了
        - name: max_minutes
          in: query
          description: 1 リクエストの最大所要時間（分）。おわりが見つからないときの打ち切りに使う
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1440
            default: 10
        - name: contains
          in: query
          description: |
            一致する行を含むリクエストだけを残す正規表現（大文字小文字無視）。
            判定はリクエストの塊単位で、スタックトレースを含むエントリ全体に対して行う。
          required: false
          schema:
            type: string
          example: PaymentException
        - name: excludes
          in: query
          description: |
            一致する行を含むリクエストを除く正規表現（大文字小文字無視）。
            `contains` と併用した場合は、含む条件を満たしても除外に当たれば落とす。
          required: false
          schema:
            type: string
          example: /health
      responses:
        '200':
          description: 追跡結果（読み込み中の場合も 200）
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SessionTraceResponse'
                  - $ref: '#/components/schemas/DetailLoadingResponse'
        '400':
          description: 必須パラメータ未指定、正規表現不正、max_minutes が範囲外または非整数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 読み込み失敗または内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    LoadStatus:
      type: string
      enum: [idle, loading, ready, error]
      description: |
        インデックス構築状態
        - `idle` — 未開始
        - `loading` — 構築中
        - `ready` — 完了
        - `error` — 失敗

    SkippedLineSample:
      type: object
      required: [source, line_no, preview]
      properties:
        source:
          type: string
          description: ログファイルパス
        line_no:
          type: integer
          format: int64
          description: 行番号
        preview:
          type: string
          description: 行内容のプレビュー

    MetaResponse:
      type: object
      required:
        - files
        - loading
        - load_status
        - load_progress
        - total
      properties:
        directory:
          type: string
          nullable: true
          description: 現在のログルートディレクトリ（未設定時は null）
        files:
          type: array
          description: 読み込み対象ログファイルのパス一覧
          items:
            type: string
        loading:
          type: boolean
          description: インデックス構築中かどうか（`load_status == loading` と同等）
        load_status:
          $ref: '#/components/schemas/LoadStatus'
        load_progress:
          type: integer
          format: int64
          description: 構築進捗（処理済みエントリ数の目安）
        total:
          type: integer
          format: int64
          description: インデックス済みエントリ総数（loading 中は進捗値）
        first:
          type: string
          nullable: true
          description: 最古タイムスタンプ（`yyyy-MM-ddTHH:mm:ss.SSS`、ready 時のみ）
        last:
          type: string
          nullable: true
          description: 最新タイムスタンプ（`yyyy-MM-ddTHH:mm:ss.SSS`、ready 時のみ）
        skipped_lines:
          type: integer
          description: パースに失敗した行数（ready かつ 1 件以上のときのみ）
        skipped_samples:
          type: array
          description: パース失敗行のサンプル（ready かつ skipped_lines > 0 のときのみ）
          items:
            $ref: '#/components/schemas/SkippedLineSample'
        load_error:
          type: string
          description: 読み込みエラーメッセージ（`load_status == error` のとき）
        log_format:
          type: string
          description: 直近の読み込みで実際に使った書式
          enum: [default, spring-boot, logback, iso8601, tomcat-juli]
        log_format_name:
          type: string
          description: 書式の表示名（画面に出す用）
        log_format_auto:
          type: boolean
          description: 自動判定かどうか。`false` なら利用者が明示指定している

    BrowseResponse:
      type: object
      required: [current, directories]
      properties:
        current:
          type: string
          description: 現在のディレクトリパス
        parent:
          type: string
          nullable: true
          description: 親ディレクトリパス（ルートの場合は null）
        directories:
          type: array
          description: サブディレクトリのパス一覧（ソート済み）
          items:
            type: string

    LoadRequest:
      type: object
      required: [directory]
      properties:
        directory:
          type: string
          description: 読み込むログディレクトリのパス
        format:
          type: string
          description: |
            ログ書式。省略または `auto` のときは先頭ファイルの冒頭からサンプリングして自動判定する。
            未知の値は 400 を返す（黙って既定へ落とさない）。
            書式を変えると索引のフィンガープリントが変わるため、索引は作り直される。
          enum: [auto, default, spring-boot, logback, iso8601, tomcat-juli]
          default: auto

    LogEntry:
      type: object
      required: [timestamp, level, logger, thread, message, source, line_no, raw]
      properties:
        timestamp:
          type: string
          description: タイムスタンプ（`yyyy-MM-ddTHH:mm:ss.SSS`）
          example: '2026-06-29T10:15:30.123'
        level:
          type: string
          description: ログレベル
          example: ERROR
        logger:
          type: string
          description: ロガー名
          example: com.example.service.UserService
        thread:
          type: string
          description: スレッド名
          example: http-nio-8080-exec-1
        message:
          type: string
          description: 1 行目メッセージ
          example: Failed to process request
        source:
          type: string
          description: ログファイルパス
          example: D:/logs/app/application.log
        line_no:
          type: integer
          format: int64
          description: 行番号（1 始まり）
        raw:
          type: string
          description: >-
            スタックトレースを含む生ログ（クライアント側のハイライト判定用）。
            レスポンス肥大を避けるため 4096 文字で切り詰められる。全文は
            /api/logs/detail を参照。

    # LogEntry を allOf で継承しない。allOf は両方の定義を満たす必要があり、LogEntry の
    # raw（null 不可の文字列）が残って、実際の応答（raw: null）が不合格になるため。
    SessionTraceEntry:
      type: object
      required: [timestamp, level, logger, thread, message, source, line_no, raw, anchor]
      properties:
        timestamp:
          type: string
          description: タイムスタンプ（`yyyy-MM-ddTHH:mm:ss.SSS`）
          example: '2026-06-16T10:00:01.010'
        level:
          type: string
          description: ログレベル
          example: INFO
        logger:
          type: string
          description: ロガー名
          example: com.example.web.CartController
        thread:
          type: string
          description: スレッド名
          example: http-nio-8080-exec-1
        message:
          type: string
          description: 1 行目メッセージ
        source:
          type: string
          description: ログファイルパス
        line_no:
          type: integer
          format: int64
          description: 行番号（1 始まり）
        raw:
          type: string
          nullable: true
          description: 追跡結果では返さない（常に null）。全文は /api/logs/detail を参照
        anchor:
          type: boolean
          description: 識別子を含む（起点になった）エントリか

    SessionTraceRequest:
      type: object
      required: [source, thread, start_found, end_reason, truncated, items]
      properties:
        source:
          type: string
          description: ログファイルパス
        thread:
          type: string
          description: スレッド名
        start_found:
          type: boolean
          description: はじまりのメッセージを見つけたか
        end_reason:
          type: string
          enum: [end, next_start, not_found, standalone]
          description: |
            おわり側の閉じ方
            - `end` — おわりのメッセージで閉じた
            - `next_start` — おわりより先に同じスレッドの次のはじまりが来たので、その直前で閉じた
            - `not_found` — 最大所要時間・ファイル末尾・行数の上限までに閉じなかった
            - `standalone` — どのリクエストにも属さない単独の行
        truncated:
          type: boolean
          description: 行数の上限（1000 行）で打ち切ったか
        items:
          type: array
          description: ファイル内の行順
          items:
            $ref: '#/components/schemas/SessionTraceEntry'

    SessionTraceResponse:
      type: object
      required: [anchor_total, truncated, filtered_out, requests]
      properties:
        anchor_total:
          type: integer
          format: int64
          description: 識別子を含むエントリの総数（絞り込みでは変わらない）
        truncated:
          type: boolean
          description: |
            上限に達して範囲を求めなかった起点があるか
            （表示 200 リクエスト、または調べる 2000 リクエスト）
        filtered_out:
          type: integer
          format: int64
          description: contains / excludes で落としたリクエスト数
        requests:
          type: array
          description: 先頭エントリの時刻順
          items:
            $ref: '#/components/schemas/SessionTraceRequest'

    LogsResponse:
      type: object
      required: [total, offset, limit, items]
      properties:
        total:
          type: integer
          format: int64
          description: フィルタ条件に一致する総件数
        offset:
          type: integer
