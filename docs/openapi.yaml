openapi: 3.0.3
info:
  title: Application Log Viewer API
  description: |
    Java アプリケーションログを Web UI で閲覧・検索する障害調査用ツールの REST API。

    指定ディレクトリ配下のログファイルを再帰的に探索し、SQLite インデックスを構築したうえで
    フィルタ付き一覧・詳細（スタックトレース含む生ログ）を提供する。

    **注意:** ローカル検証専用。認証は実装されていないため、インターネットに公開しないこと。
  version: 1.0.0
  contact:
    name: Application Log Viewer
  license:
    name: MIT

servers:
  - url: http://127.0.0.1:8766
    description: ローカル開発（デフォルト）
  - url: http://localhost:8766
    description: Docker / ローカル

tags:
  - name: meta
    description: 読み込み状態・メタ情報
  - name: browse
    description: ディレクトリブラウザ
  - name: load
    description: ログ読み込み・インデックス構築
  - name: logs
    description: ログ検索・詳細
  - name: session
    description: セッション追跡（同一リクエストのログの抽出）
  - name: saved-searches
    description: 検索・追跡条件の保存（ツールホーム直下の JSON ファイル）
  - name: log-formats
    description: 利用者定義のログ書式（ツールホーム直下のテキストファイル）

paths:
  /api/meta:
    get:
      tags: [meta]
      summary: 読み込み状態を取得
      description: |
        現在のログディレクトリ、読み込み対象ファイル、インデックス構築の進捗、
        エントリ件数、タイムスタンプ範囲、パース失敗行のサンプルなどを返す。
      operationId: getMeta
      responses:
        '200':
          description: メタ情報
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaResponse'
              examples:
                ready:
                  summary: 読み込み完了
                  value:
                    directory: D:/logs/app
                    files:
                      - D:/logs/app/application.log
                      - D:/logs/app/application.log.2026-06-28
                    loading: false
                    load_status: ready
                    load_progress: 12345
                    total: 12345
                    first: '2026-06-28T00:00:00.123'
                    last: '2026-06-29T23:59:59.999'
                loading:
                  summary: 読み込み中
                  value:
                    directory: D:/logs/app
                    files:
                      - D:/logs/app/application.log
                    loading: true
                    load_status: loading
                    load_progress: 5000
                    total: 5000
                    first: null
                    last: null

  /api/browse:
    get:
      tags: [browse]
      summary: ディレクトリ一覧を取得
      description: |
        ログディレクトリ選択 UI 向けに、指定パス直下のサブディレクトリ一覧を返す。
        `path` を省略した場合は、現在のログルート（未設定時はカレントディレクトリ）を起点とする。
        ドット（`.`）で始まるディレクトリは除外される。
      operationId: browseDirectories
      parameters:
        - name: path
          in: query
          description: 探索開始パス（絶対パスまたは相対パス）
          required: false
          schema:
            type: string
          example: D:/logs
      responses:
        '200':
          description: ディレクトリ一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrowseResponse'
        '400':
          description: ディレクトリ不存在または読み取りエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/load:
    post:
      tags: [load]
      summary: ログディレクトリを読み込み開始
      description: |
        指定ディレクトリ配下のログファイルを再帰的に探索し、SQLite インデックス構築を非同期で開始する。
        レスポンスは `/api/meta` と同じ形式で、開始直後の状態を返す。
        既に読み込み中の場合は新しい世代として再開始し、古いワーカーの結果は破棄される。
      operationId: loadDirectory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoadRequest'
            example:
              directory: D:/logs/app
      responses:
        '200':
          description: 読み込み開始後のメタ情報
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetaResponse'
        '400':
          description: リクエスト不正（JSON 解析失敗、directory 未指定、ディレクトリ不存在、ログ探索失敗）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/logs:
    get:
      tags: [logs]
      summary: フィルタ付きログ一覧を取得
      description: |
        インデックス済みログをフィルタ条件で絞り込み、ページング付きで返す。

        - レベル・日時は SQL で事前絞り込み
        - logger / thread / message / source / grep は Java 側で正規表現マッチ（大文字小文字無視）
        - `grep` 指定時はスタックトレースを含む生ログ全文を照合

        インデックス構築中（`load_status == loading`）は `loading: true` と空の `items` を返す。
      operationId: queryLogs
      parameters:
        - name: level
          in: query
          description: ログレベル（カンマ区切り、大文字小文字無視）。例 `ERROR`, `WARN,ERROR`
          required: false
          schema:
            type: string
          example: WARN,ERROR
        - name: logger
          in: query
          description: ロガー名の正規表現（大文字小文字無視）
          required: false
          schema:
            type: string
        - name: thread
          in: query
          description: スレッド名の正規表現（大文字小文字無視）
          required: false
          schema:
            type: string
        - name: message
          in: query
          description: 1 行目メッセージの正規表現（大文字小文字無視）
          required: false
          schema:
            type: string
        - name: grep
          in: query
          description: エントリ全体（スタックトレース含む）の正規表現（大文字小文字無視）
          required: false
          schema:
            type: string
        - name: source
          in: query
          description: ログファイル名の正規表現（大文字小文字無視）
          required: false
          schema:
            type: string
        - name: since
          in: query
          description: |
            開始日時（この時刻以降）。
            対応形式: `yyyy-MM-ddTHH:mm:ss.SSS` / `yyyy-MM-dd HH:mm:ss.SSS` / `HH:mm:ss` 付き /
            `HH:mm` 付き / `yyyy-MM-dd`。
            存在しない日時（`2025-02-30` 等）や末尾に余分な文字がある入力は 400 を返す
            （繰り上げて別の期間として扱わない）。
          required: false
          schema:
            type: string
          example: '2026-06-28T00:00:00.000'
        - name: until
          in: query
          description: 終了日時（この時刻以前）。形式は `since` と同じ
          required: false
          schema:
            type: string
          example: '2026-06-29T23:59:59.999'
        - name: limit
          in: query
          description: 取得件数（デフォルト 500、最大 5000）
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            maximum: 5000
            default: 500
        - name: offset
          in: query
          description: スキップ件数（デフォルト 0）
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
      responses:
        '200':
          description: ログ一覧（読み込み中の場合も 200）
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LogsResponse'
                  - $ref: '#/components/schemas/LogsLoadingResponse'
        '400':
          description: 正規表現不正、日時形式不正、limit/offset 非整数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 読み込み失敗（`load_status == error`）または内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/logs/detail:
    get:
      tags: [logs]
      summary: ログ詳細（生ログ全文）を取得
      description: |
        指定ログファイル・行番号のエントリについて、スタックトレースを含む生ログ全文を返す。
        同一行番号に複数エントリがある場合は `timestamp` で区別する。

        インデックス構築中は `loading: true` のみを返す。
      operationId: getLogDetail
      parameters:
        - name: source
          in: query
          description: ログファイルパス
          required: true
          schema:
            type: string
          example: D:/logs/app/application.log
        - name: line_no
          in: query
          description: 行番号（1 始まり）
          required: true
          schema:
            type: integer
            format: int64
          example: 42
        - name: timestamp
          in: query
          description: ISO タイムスタンプ（同一行番号の複数エントリを区別する場合に指定）
          required: false
          schema:
            type: string
          example: '2026-06-29T10:15:30.123'
      responses:
        '200':
          description: ログ詳細（読み込み中の場合も 200）
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LogDetailResponse'
                  - $ref: '#/components/schemas/DetailLoadingResponse'
        '400':
          description: source 未指定、line_no 非整数、timestamp 不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 該当行が見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 読み込み失敗または I/O エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/session-trace:
    get:
      tags: [session]
      summary: セッション ID を含むリクエストのログを、リクエストごとにまとめて取得
      description: |
        `id` を含むエントリ（スタックトレースを含む全体を文字列として照合、大文字小文字を区別）を起点に、
        **同じログファイル・同じスレッド**で `start` に一致する行から `end` に一致する行までを
        1 リクエストとして返す。`start` / `end` は 1 行目メッセージへの正規表現（大文字小文字無視）。

        - 起点から遡って最も近いはじまりを探す。途中で別のおわりに該当したら遡るのをやめる
        - 起点から進み、おわりで閉じる。おわりより先に次のはじまりが来たらその直前で閉じる
        - はじまりが無くても、次のはじまりより先におわりがあれば 1 リクエストとする（`start_found: false`）
        - はじまりもおわりも起点を囲まない行は単独で返す（`end_reason: standalone`）
        - どちらの方向も `max_minutes` を超えたところで打ち切る

        同期処理（1 リクエストを 1 スレッドが最後まで処理する）が前提。非同期処理で別スレッドに出たログ、
        WebFlux / Netty のように 1 スレッドで複数リクエストを交互に処理する方式、別ファイルに出たログは
        正しく扱えない。

        返すのは最大 200 リクエスト、1 リクエストあたり最大 1000 行。絞り込みで落としたものも
        数えるため、範囲を求めるリクエスト数は 2000 件で打ち切る（`truncated: true`）。
        インデックス構築中は `loading: true` のみを返す。
      operationId: traceSession
      parameters:
        - name: id
          in: query
          description: セッション ID などの識別子。正規表現ではなく文字列として照合する（大文字小文字を区別）
          required: true
          schema:
            type: string
          example: 8F3A2C91D4E6B7A0.node1
        - name: mode
          in: query
          description: |
            範囲の決め方。
            - `boundary`（既定） — `start` / `end` の語で区切る。`start` と `end` が必須
            - `window` — セッション ID のある行の前後 `window_secs` 秒にある、
              同じファイル・同じスレッドの行を 1 リクエストとみなす。語の指定は不要。
              時間だけで区切るため、同じスレッドが直前・直後に処理した別のリクエストの行が
              混ざることがある（誤検知）。ID が窓の内に続けて出たときは 1 つにまとめる
          required: false
          schema:
            type: string
            enum: [boundary, window]
            default: boundary
        - name: window_secs
          in: query
          description: '`mode=window` のとき、ID の行の前後に見る秒数'
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 3600
            default: 10
        - name: start
          in: query
          description: リクエストのはじまりの 1 行目メッセージに一致する正規表現（大文字小文字無視。`mode=boundary` で必須）
          required: false
          schema:
            type: string
          example: ^リクエスト開始
        - name: end
          in: query
          description: リクエストのおわりの 1 行目メッセージに一致する正規表現（大文字小文字無視。`mode=boundary` で必須）
          required: false
          schema:
            type: string
          example: ^リクエスト終了
        - name: max_minutes
          in: query
          description: 1 リクエストの最大所要時間（分）。起点からのはじまり探索とおわり探索の両方の打ち切りに使う（`mode=boundary` のみ）
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1440
            default: 10
        - name: contains
          in: query
          description: |
            一致する行を含むリクエストだけを残す正規表現（大文字小文字無視）。
            判定はリクエストの塊単位で、スタックトレースを含むエントリ全体に対して行う。
          required: false
          schema:
            type: string
          example: PaymentException
        - name: excludes
          in: query
          description: |
            一致する行を含むリクエストを除く正規表現（大文字小文字無視）。
            `contains` と併用した場合は、含む条件を満たしても除外に該当すれば落とす。
          required: false
          schema:
            type: string
          example: /health
      responses:
        '200':
          description: 追跡結果（読み込み中の場合も 200）
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SessionTraceResponse'
                  - $ref: '#/components/schemas/DetailLoadingResponse'
        '400':
          description: 必須パラメータ未指定、正規表現不正、max_minutes が範囲外または非整数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 読み込み失敗または内部エラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/saved-searches:
    get:
      tags: [saved-searches]
      summary: 保存した検索・追跡条件の一覧
      description: |
        ツールホーム直下（`APLV_HOME`。未設定時はリポジトリ直下）の `aplv-saved-searches.json` を読む。
        条件に含まれる正規表現は文字列のまま返し、この API ではコンパイルもマッチも行わない。
        ファイルがないときは空の `items` を返す。壊れた項目や 200 件を超えた余りは読み飛ばし、
        `skipped` に件数を入れる。件数が上限を超えていたときは `overflow` を `true` にし、
        そのファイルへの保存・削除は 400 で断る（書き戻すと読み飛ばした条件が消えるため）。
      operationId: listSavedSearches
      responses:
        '200':
          description: 保存条件の一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedSearchListResponse'
        '405':
          description: 未対応の HTTP メソッド
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 保存ファイルが読めない、または JSON が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [saved-searches]
      summary: 検索・追跡条件を保存する
      description: |
        `name` と `mode` が同じ項目があれば上書きし、なければ追加する。
        `fields` の値は正規表現を含みうるが、文字列として保存するだけ（妥当性は検証しない）。
        未知のキーや、指定した `mode` 以外のタブの入力 id は捨てる。
      operationId: upsertSavedSearch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedSearchUpsertRequest'
            examples:
              search:
                summary: 検索条件
                value:
                  name: エラーだけ
                  mode: search
                  fields:
                    level: ERROR
                    grep: Exception\\d+
              trace:
                summary: 追跡条件
                value:
                  name: 決済
                  mode: trace
                  fields:
                    trace-start: '^リクエスト開始'
                    trace-end: '^リクエスト終了'
      responses:
        '200':
          description: 保存した 1 件
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedSearch'
        '400':
          description: 名前未指定、mode 不正、件数上限、保存ファイルが上限超過、JSON 不正、本文が大きすぎる
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: 未対応の HTTP メソッド
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 保存ファイルの書き込み失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [saved-searches]
      summary: 保存した条件を削除する
      operationId: deleteSavedSearch
      parameters:
        - name: id
          in: query
          required: true
          description: 保存時にサーバが採番した UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 削除した
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: boolean
                    enum: [true]
        '400':
          description: id 未指定または形式不正、保存ファイルが上限超過
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 指定した id がない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: 未対応の HTTP メソッド
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 保存ファイルの書き込み失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/log-formats:
    get:
      tags: [log-formats]
      summary: 利用者定義のログ書式の一覧
      description: |
        ツールホーム直下（`APLV_HOME`。未設定時はリポジトリ直下）の
        `aplv-log-formats.txt` を読む。正規表現は書かれたままの文字列で返し、この API では
        マッチを行わない。壊れた項目や 20 件を超えた余りは読み飛ばし、件数を
        `skipped_formats`（書式の節）と `skipped_lines`（行）に分けて入れる。
        ファイルがないときは空の `items` を返す。読み飛ばしがある間は、保存・削除を
        400 で断る（書き戻すとその部分が消えるため）。
      operationId: listLogFormats
      responses:
        '200':
          description: 書式の一覧
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogFormatListResponse'
        '500':
          description: 書式ファイルを読めない（通常ファイルでない・大きすぎる等）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [log-formats]
      summary: 書式を登録する（同じ id は上書き）
      description: |
        値の検査は保存前に行う。正規表現がコンパイルできない、`ts` グループがない、
        日時書式が不正、id が組み込み書式と重なる場合は 400 で、ファイルは変えない。
        正規表現は書いたままの形で送る。
      operationId: upsertLogFormat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogFormat'
      responses:
        '200':
          description: 登録した 1 件
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogFormat'
        '400':
          description: 値が不正、件数上限、書式ファイルに読み飛ばし（上限超過を含む）がある
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 書式ファイルの書き込み失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [log-formats]
      summary: 書式を削除する
      operationId: deleteLogFormat
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 削除した
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: boolean
                    enum: [true]
        '400':
          description: id 未指定、書式ファイルに読み飛ばし（上限超過を含む）がある
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 指定した書式がない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/log-formats/try:
    post:
      tags: [log-formats]
      summary: 書式をサンプル 1 行で試す（保存しない）
      description: |
        取り込みと同じ経路で 1 行を解析し、取り出せた項目を返す。一致しなかった場合は
        `reason` に理由を入れる。「正規表現が一致しない」と「一致したが日時を読めない」は
        直す場所が違うため区別する。

        `timestamp` は空でもよい。その場合は正規表現だけを見て、`ts` に取れた文字列を
        `ts_text` に入れ、`timestamp_checked` を `false` にする
        （正規表現を組み立てている途中で試せるようにするため）。
      operationId: tryLogFormat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              # LogFormat を allOf で取り込まない。保存と違って id は必須ではないが、
              # 失敗文の呼び名に使う。timestamp も空でよいため、必須の集合が別になる。
              type: object
              required: [pattern, sample]
              properties:
                id:
                  type: string
                  maxLength: 40
                  description: |
                    任意。試し打ちの失敗文に出す呼び名（未指定なら「いま入力中のもの」）。
                name:
                  type: string
                  maxLength: 100
                  description: 任意。表示名（失敗文では id より優先されない。id が空のときの補助）
                pattern:
                  type: string
                  description: 1 行に一致させる Java の正規表現（名前付きグループ `ts` が必須）
                  maxLength: 4000
                timestamp:
                  type: string
                  description: |
                    `ts` の読み方。**空でもよい**。空のときは正規表現だけを見て、
                    `ts_text` と `timestamp_checked: false` を返す。
                  maxLength: 100
                sample:
                  type: string
                  description: 試すログの 1 行
      responses:
        '200':
          description: 試した結果
          content:
            application/json:
              schema:
                type: object
                required: [matched]
                properties:
                  matched:
                    type: boolean
                  reason:
                    type: string
                    description: 一致しなかった理由（`matched` が false のとき）
                  timestamp_checked:
                    type: boolean
                    description: 日時書式まで確かめたか。`false` なら正規表現だけを見ている
                  ts_text:
                    type: string
                    description: '`ts` に取れた文字列（`timestamp_checked` が false のとき）'
                  timestamp:
                    type: string
                    description: 取り出した日時（ISO 形式。`timestamp_checked` が true のとき）
                  level:
                    type: string
                  thread:
                    type: string
                  logger:
                    type: string
                  message:
                    type: string
        '400':
          description: 正規表現・日時書式が不正、サンプル未指定、照合の打ち切り
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    LogFormat:
      type: object
      required: [id, pattern, timestamp]
      properties:
        id:
          type: string
          description: 英小文字・数字・ハイフン。組み込み書式と同じ id は使えない
          maxLength: 40
        name:
          type: string
          description: 画面に出す名前。省略すると id
          maxLength: 100
        pattern:
          type: string
          description: |
            1 行に当てる Java の正規表現。名前付きグループ `ts` が必須で、
            `level` / `thread` / `logger` / `message` は任意。
          maxLength: 4000
        timestamp:
          type: string
          description: '`ts` の読み方（Java の DateTimeFormatter。月名は英語前提）'
          maxLength: 100

    LogFormatListResponse:
      type: object
      required: [items, skipped_formats, skipped_lines, file, max]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LogFormat'
        skipped_formats:
          type: integer
          minimum: 0
          description: 読めなかった書式の件数（`[id]` の節ごと）
        skipped_lines:
          type: integer
          minimum: 0
          description: 書式に属さない・解釈できなかった行の件数
        file:
          type: string
          description: 実際に読み書きしている書式ファイルの絶対パス（画面の表示用）
        max:
          type: integer
          description: 登録できる書式の上限

    LoadStatus:
      type: string
      enum: [idle, loading, ready, error]
      description: |
        インデックス構築状態
        - `idle` — 未開始
        - `loading` — 構築中
        - `ready` — 完了
        - `error` — 失敗

    SkippedLineSample:
      type: object
      required: [source, line_no, preview]
      properties:
        source:
          type: string
          description: ログファイルパス
        line_no:
          type: integer
          format: int64
          description: 行番号
        preview:
          type: string
          description: 行内容のプレビュー

    MetaResponse:
      type: object
      required:
        - files
        - loading
        - load_status
        - load_progress
        - total
      properties:
        directory:
          type: string
          nullable: true
          description: 現在のログルートディレクトリ（未設定時は null）
        files:
          type: array
          description: 読み込み対象ログファイルのパス一覧
          items:
            type: string
        loading:
          type: boolean
          description: インデックス構築中かどうか（`load_status == loading` と同等）
        load_status:
          $ref: '#/components/schemas/LoadStatus'
        load_progress:
          type: integer
          format: int64
          description: 構築進捗（処理済みエントリ数の目安）
        total:
          type: integer
          format: int64
          description: インデックス済みエントリ総数（loading 中は進捗値）
        first:
          type: string
          nullable: true
          description: 最古タイムスタンプ（`yyyy-MM-ddTHH:mm:ss.SSS`、ready 時のみ）
        last:
          type: string
          nullable: true
          description: 最新タイムスタンプ（`yyyy-MM-ddTHH:mm:ss.SSS`、ready 時のみ）
        skipped_lines:
          type: integer
          description: パースに失敗した行数（ready かつ 1 件以上のときのみ）
        skipped_samples:
          type: array
          description: パース失敗行のサンプル（ready かつ skipped_lines > 0 のときのみ）
          items:
            $ref: '#/components/schemas/SkippedLineSample'
        load_error:
          type: string
          description: 読み込みエラーメッセージ（`load_status == error` のとき）
        log_format:
          type: string
          description: |
            直近の読み込みで実際に使った書式の id。組み込みは default / spring-boot /
            logback / iso8601 / tomcat-juli。利用者が aplv-log-formats.txt に定義した
            書式の id が入ることもある。
        log_format_name:
          type: string
          description: 書式の表示名（画面に出す用）
        log_format_custom:
          type: boolean
          description: |
            使った書式が利用者定義かどうか。画面は読み飛ばした行の説明を
            これで書き分ける（利用者定義なら、直す先は自分の正規表現）。
        log_format_auto:
          type: boolean
          description: 自動判定かどうか。`false` なら利用者が明示指定している
        log_formats:
          type: array
          description: 選べる書式の一覧（組み込み + 利用者定義）。画面のプルダウンを作るのに使う
          items:
            type: object
            required: [id, name, custom]
            properties:
              id:
                type: string
                description: '`/api/load` の `format` や CLI の `--format` に渡す id'
              name:
                type: string
              custom:
                type: boolean
                description: 利用者が aplv-log-formats.txt に定義した書式なら true
        log_formats_error:
          type: string
          description: |
            書式ファイルを読めなかった理由（読めたときは出ない）。組み込み書式は
            そのまま使えるので、読み込み自体は続行する。

    BrowseResponse:
      type: object
      required: [current, directories]
      properties:
        current:
          type: string
          description: 現在のディレクトリパス
        parent:
          type: string
          nullable: true
          description: 親ディレクトリパス（ルートの場合は null）
        directories:
          type: array
          description: サブディレクトリのパス一覧（ソート済み）
          items:
            type: string

    LoadRequest:
      type: object
      required: [directory]
      properties:
        directory:
          type: string
          description: 読み込むログディレクトリのパス
        format:
          type: string
          description: |
            ログ書式。省略または `auto` のときは先頭ファイルの冒頭からサンプリングして自動判定する。
            未知の値は 400 を返す（黙って既定へ落とさない）。
            書式を変えると索引のフィンガープリントが変わるため、索引は作り直される。
          enum: [auto, default, spring-boot, logback, iso8601, tomcat-juli]
          default: auto

    LogEntry:
      type: object
      required: [timestamp, level, logger, thread, message, source, line_no, raw]
      properties:
        timestamp:
          type: string
          description: タイムスタンプ（`yyyy-MM-ddTHH:mm:ss.SSS`）
          example: '2026-06-29T10:15:30.123'
        level:
          type: string
          description: ログレベル
          example: ERROR
        logger:
          type: string
          description: ロガー名
          example: com.example.service.UserService
        thread:
          type: string
          description: スレッド名
          example: http-nio-8080-exec-1
        message:
          type: string
          description: 1 行目メッセージ
          example: Failed to process request
        source:
          type: string
          description: ログファイルパス
          example: D:/logs/app/application.log
        line_no:
          type: integer
          format: int64
          description: 行番号（1 始まり）
        raw:
          type: string
          description: >-
            スタックトレースを含む生ログ（クライアント側のハイライト判定用）。
            レスポンス肥大を避けるため 4096 文字で切り詰められる。全文は
            /api/logs/detail を参照。

    # LogEntry を allOf で継承しない。allOf は両方の定義を満たす必要があり、LogEntry の
    # raw（null 不可の文字列）が残って、実際の応答（raw: null）が不合格になるため。
    SessionTraceEntry:
      type: object
      required: [timestamp, level, logger, thread, message, source, line_no, raw, anchor]
      properties:
        timestamp:
          type: string
          description: タイムスタンプ（`yyyy-MM-ddTHH:mm:ss.SSS`）
          example: '2026-06-16T10:00:01.010'
        level:
          type: string
          description: ログレベル
          example: INFO
        logger:
          type: string
          description: ロガー名
          example: com.example.web.CartController
        thread:
          type: string
          description: スレッド名
          example: http-nio-8080-exec-1
        message:
          type: string
          description: 1 行目メッセージ
        source:
          type: string
          description: ログファイルパス
        line_no:
          type: integer
          format: int64
          description: 行番号（1 始まり）
        raw:
          type: string
          nullable: true
          description: 追跡結果では返さない（常に null）。全文は /api/logs/detail を参照
        anchor:
          type: boolean
          description: 識別子を含む（起点になった）エントリか

    SessionTraceRequest:
      type: object
      required: [source, thread, start_found, end_reason, truncated, items]
      properties:
        source:
          type: string
          description: ログファイルパス
        thread:
          type: string
          description: スレッド名
        start_found:
          type: boolean
          description: はじまりのメッセージを見つけたか
        end_reason:
          type: string
          enum: [end, next_start, not_found, standalone, window]
          description: |
            おわり側の閉じ方
            - `end` — おわりのメッセージで閉じた
            - `next_start` — おわりより先に同じスレッドの次のはじまりが来たので、その直前で閉じた
            - `not_found` — 最大所要時間・ファイル末尾・行数の上限までに閉じなかった
            - `standalone` — どのリクエストにも属さない単独の行
            - `window` — `mode=window` で、前後の時間だけで区切った
        truncated:
          type: boolean
          description: 行数の上限（1000 行）で打ち切ったか
        items:
          type: array
          description: ファイル内の行順
          items:
            $ref: '#/components/schemas/SessionTraceEntry'

    SessionTraceResponse:
      type: object
      required: [anchor_total, truncated, filtered_out, requests]
      properties:
        anchor_total:
          type: integer
          format: int64
          description: 識別子を含むエントリの総数（絞り込みでは変わらない）
        truncated:
          type: boolean
          description: |
            上限に達して範囲を求めなかった起点があるか
            （表示 200 リクエスト、または調べる 2000 リクエスト）
        filtered_out:
          type: integer
          format: int64
          description: contains / excludes で落としたリクエスト数
        requests:
          type: array
          description: 先頭エントリの時刻順
          items:
            $ref: '#/components/schemas/SessionTraceRequest'

    LogsResponse:
      type: object
      required: [total, offset, limit, items]
      properties:
        total:
          type: integer
          format: int64
          description: フィルタ条件に一致する総件数
        offset:
          type: integer
          format: int64
          description: スキップ件数
        limit:
          type: integer
          format: int64
          description: 取得件数上限
        items:
          type: array
          items:
            $ref: '#/components/schemas/LogEntry'

    LogsLoadingResponse:
      type: object
      required: [loading, load_progress, total, offset, limit, items]
      properties:
        loading:
          type: boolean
          enum: [true]
        load_progress:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
          enum: [0]
        offset:
          type: integer
          format: int64
          enum: [0]
        limit:
          type: integer
          format: int64
          enum: [0]
        items:
          type: array
          maxItems: 0
          items: {}

    LogDetailResponse:
      type: object
      required: [source, line_no, timestamp, level, logger, thread, raw]
      properties:
        source:
          type: string
          description: ログファイルパス
        line_no:
          type: integer
          format: int64
          description: 行番号
        timestamp:
          type: string
          description: タイムスタンプ（`yyyy-MM-ddTHH:mm:ss.SSS`）
        level:
          type: string
        logger:
          type: string
        thread:
          type: string
        raw:
          type: string
          description: スタックトレースを含む生ログ全文

    DetailLoadingResponse:
      type: object
      required: [loading, load_progress]
      properties:
        loading:
          type: boolean
          enum: [true]
        load_progress:
          type: integer
          format: int64

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: エラーメッセージ

    SavedSearchListResponse:
      type: object
      required: [items, skipped, overflow]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SavedSearch'
        skipped:
          type: integer
          minimum: 0
          description: 壊れている、または 200 件を超えたために読み飛ばした件数
        overflow:
          type: boolean
          description: |
            件数が 200 件の上限を超えていたか。`true` のときは保存・削除が 400 で断られる
            （書き戻すと読み込めていない条件が消えるため）。
        file:
          type: string
          description: 実際に読み書きしている保存ファイルの絶対パス（画面の表示用）

    SavedSearchUpsertRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
          description: 呼び出し用の名前。制御文字は不可
        mode:
          type: string
          enum: [search, trace]
          default: search
          description: 検索タブかリクエスト追跡タブか
        fields:
          type: object
          additionalProperties:
            type: string
          description: |
            入力欄 id から値へのマップ。値は正規表現を含みうるが文字列として扱う。
            未知のキー、および mode に属さないタブの id は保存時に捨てる。

    SavedSearch:
      type: object
      required: [id, name, savedAt, mode, fields]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        savedAt:
          type: string
          description: 保存時刻（ISO-8601）。手編集では空文字もありうる
        mode:
          type: string
          enum: [search, trace]
        fields:
          type: object
          additionalProperties:
            type: string
          description: 入力欄 id から値へのマップ（正規表現は未コンパイルの文字列）
